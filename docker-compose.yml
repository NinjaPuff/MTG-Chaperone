services:
  postgres:
    image: postgres:16-alpine
    container_name: mtgleague-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mtgleague
    ports:
      - '5433:5432' # 5433 avoids conflict with a local Windows PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mtg-chaperone-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/mtgleague
      NODE_ENV: development
      SERVER_PORT: 3000
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: dev-secret-change-in-production
      SESSION_SECRET: dev-secret-change-in-production
    ports:
      - '3000:3000'
    env_file:
      - .env

volumes:
  pgdata:
